[project]
name = "supplier-intake"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yassin Hassan", email = "162758084+yassin-hassan@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
supplier-intake = "supplier_intake:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint] 
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
